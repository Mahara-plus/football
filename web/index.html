<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Football Challenge</title><link rel="stylesheet" href="style.css"><script src="/socket.io/socket.io.js"></script><script src="config.js"></script></head>
<body><main class="shell"><header><div class="ball">⚽</div><div><h1>Football Challenge</h1><p>تحدّى أصدقاءك في كرة القدم</p></div></header>
<section id="auth" class="card"><h2>تسجيل الدخول</h2><input id="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><input id="username" placeholder="اسم المستخدم (لإنشاء حساب)"><div class="row"><button id="login">دخول</button><button class="secondary" id="register">إنشاء حساب</button></div><p id="authMsg" class="msg"></p></section>
<section id="lobby" class="card hidden"><div class="row between"><h2>أهلاً <span id="who"></span></h2><button class="secondary small" id="logout">خروج</button></div>
<h3>إنشاء غرفة</h3><div class="grid"><label>عدد الجولات<input id="rounds" type="number" min="1" max="100" value="10"></label><label>أقصى عدد لاعبين<input id="maxPlayers" type="number" min="2" max="20" value="8"></label><label>وقت السؤال بالثواني<input id="seconds" type="number" min="5" max="90" value="20"></label><label>نوع الأسئلة<select id="category"><option value="mixed">مختلط: انتقالات + عامة</option><option value="transfer">انتقالات فقط</option><option value="general">معلومات عامة فقط</option></select></label></div><button id="create">إنشاء غرفة</button><hr><h3>الانضمام إلى غرفة</h3><div class="row"><input id="roomCode" placeholder="كود الغرفة"><button id="join">انضمام</button></div><p id="lobbyMsg" class="msg"></p></section>
<section id="room" class="card hidden"><div class="row between"><h2>الغرفة <span id="code"></span></h2><span id="roomStatus" class="pill">انتظار</span></div><p id="roomSettings"></p><h3>اللاعبون</h3><ul id="players"></ul><button id="start">ابدأ المباراة</button><button class="secondary" id="leave">مغادرة</button></section>
<section id="game" class="card hidden"><div class="row between"><span id="roundLabel"></span><span id="timer" class="pill"></span></div><span id="categoryLabel" class="tag"></span><h2 id="question"></h2><div id="options" class="options"></div><p id="feedback" class="msg"></p><h3>النتائج المباشرة</h3><ul id="scores"></ul></section>
<section id="results" class="card hidden"><h2>🏆 انتهت المباراة</h2><ol id="ranking"></ol><button id="back">العودة للرئيسية</button></section>
<footer>Football Challenge · نسخة تجريبية للمرحلة الثانية</footer></main><script src="app.js"></script></body></html>
