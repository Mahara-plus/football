services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: football
      POSTGRES_PASSWORD: football_password
      POSTGRES_DB: football
    ports: ["5432:5432"]
    volumes: [ "pgdata:/var/lib/postgresql/data", "./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro" ]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
